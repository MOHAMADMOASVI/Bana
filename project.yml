name: Bana
options:
  bundleIdPrefix: com.mosavi
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: fa
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Bana:
    type: application
    platform: macOS
    sources: [Bana]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mosavi.Bana
        CODE_SIGN_ENTITLEMENTS: Bana/Bana.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bana
        INFOPLIST_KEY_LSHasLocalizedDisplayName: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  BanaTests:
    type: bundle.unit-test
    platform: macOS
    sources: [BanaTests]
    dependencies:
      - target: Bana
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Bana.app/Contents/MacOS/Bana"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Bana:
    build:
      targets:
        Bana: all
    test:
      targets: [BanaTests]
